<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>영웅 선택 - UI 레퍼런스</title>
<style>
/* ============================================================
   영웅 선택 (Character Select) — UI Reference
   Canvas 1080 x 1920 / BrightReferences 테마 (Dark Navy + Gold)
   ============================================================ */
:root{
  --navy-0:#050a12;
  --navy-1:#0b1522;
  --navy-2:#122032;
  --navy-3:#18293f;
  --panel-a:rgba(20,34,52,.92);
  --panel-b:rgba(11,21,34,.92);
  --gold:#d9b96e;
  --gold-lt:#f0dcae;
  --gold-dim:rgba(217,185,110,.28);
  --cream:#e8dcc0;
  --text:#cdd7e4;
  --text-dim:#7f8ea3;
  --cyan:#57c8e8;
  --ember:#e8613f;
  --ember-d:#b8362a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#05080d;
  display:flex;align-items:center;justify-content:center;
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  overflow:hidden;
}
/* 뷰포트에 맞춰 축소 */
#viewport{width:1080px;height:1920px;transform-origin:center center;}

/* ---------- 프레임 ---------- */
.phone{
  position:relative;width:1080px;height:1920px;overflow:hidden;
  background:
    radial-gradient(120% 70% at 50% 8%, #1c3550 0%, transparent 60%),
    linear-gradient(180deg,#0d1929 0%,#0a1420 45%,#060c15 100%);
  color:var(--text);
}
.bg-glow{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(46% 30% at 50% 30%, rgba(88,140,200,.20) 0%, transparent 70%),
    radial-gradient(70% 40% at 50% 52%, rgba(217,185,110,.10) 0%, transparent 70%);
}
.bg-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 60% at 50% 45%, transparent 30%, rgba(0,0,0,.62) 100%);
}
.bg-rays{
  position:absolute;left:50%;top:-120px;width:1400px;height:1200px;
  transform:translateX(-50%);pointer-events:none;opacity:.35;
  background:
    conic-gradient(from 200deg at 50% 0%,
      transparent 0deg, rgba(150,190,240,.10) 12deg, transparent 24deg,
      transparent 40deg, rgba(217,185,110,.08) 52deg, transparent 64deg,
      transparent 96deg, rgba(150,190,240,.09) 108deg, transparent 120deg);
  filter:blur(2px);
}

/* ---------- 상단 바 ---------- */
.topbar{
  position:relative;z-index:6;height:150px;
  display:flex;align-items:center;justify-content:center;
  padding:0 40px;
}
.icon-btn{
  position:absolute;top:44px;width:64px;height:64px;border-radius:16px;
  background:linear-gradient(180deg,rgba(30,48,70,.9),rgba(14,25,40,.9));
  border:1px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
}
.icon-btn.left{left:36px}
.icon-btn.right{right:36px}
.title-wrap{display:flex;align-items:center;gap:22px;margin-top:6px}
.title-wrap .line{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),var(--gold))}
.title-wrap .line.r{background:linear-gradient(270deg,transparent,var(--gold-dim),var(--gold))}
.dia{width:12px;height:12px;transform:rotate(45deg);border:1px solid var(--gold);background:rgba(217,185,110,.25)}
.screen-title{
  font-size:44px;font-weight:700;letter-spacing:6px;color:var(--gold-lt);
  text-shadow:0 0 18px rgba(217,185,110,.35),0 2px 4px rgba(0,0,0,.7);
}
.sub-title{
  position:absolute;top:112px;left:0;right:0;text-align:center;
  font-size:22px;color:var(--text-dim);letter-spacing:3px;
}

/* ---------- 스테이지 ---------- */
.stage{
  position:relative;height:840px;margin-top:4px;z-index:5;
}
.skyfield{position:absolute;inset:0;pointer-events:none}
.skyfield span{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#dbe8f7;box-shadow:0 0 8px rgba(200,225,255,.9);
  animation:tw 4.5s ease-in-out infinite;animation-delay:var(--d);opacity:.25;
}
@keyframes tw{0%,100%{opacity:.16;transform:scale(.7)}50%{opacity:.7;transform:scale(1.15)}}

/* 바닥 플랫폼 */
.floor{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  width:1000px;height:190px;pointer-events:none;
}
.floor .disc{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(50% 60% at 50% 50%, rgba(94,140,196,.28) 0%, rgba(30,52,80,.16) 45%, transparent 72%);
}
.floor .rim{
  position:absolute;left:60px;right:60px;top:52px;height:86px;border-radius:50%;
  border:1px solid rgba(217,185,110,.30);
  box-shadow:0 0 30px rgba(217,185,110,.12), inset 0 0 40px rgba(217,185,110,.06);
}
.floor .rim.inner{left:150px;right:150px;top:70px;height:52px;border-color:rgba(217,185,110,.18)}
.floor-line{
  position:absolute;left:40px;right:40px;bottom:92px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(217,185,110,.35),transparent);
}

/* 라인업 */
.lineup{
  position:absolute;left:0;right:0;bottom:104px;
  display:flex;align-items:flex-end;justify-content:center;gap:8px;
  padding:0 22px;
}
.hero{
  position:relative;width:196px;height:520px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  cursor:pointer;
  transform:translateY(var(--dy,0px));
  transition:transform .35s ease, filter .35s ease, opacity .35s ease;
}
.hero[data-depth="out"]{--dy:18px;--ds:.84}
.hero[data-depth="mid"]{--dy:8px;--ds:.93}
.hero[data-depth="ctr"]{--dy:0px;--ds:1}
.hero.is-selected{--ds:1.14;z-index:4}
.hero.dimmed{filter:brightness(.38) saturate(.30) blur(.5px);opacity:.9}
.hero.locked{cursor:not-allowed}
.hero.locked.dimmed{filter:brightness(.42) saturate(.15) blur(.4px)}

.figure-box{position:relative;width:196px;height:384px;display:flex;align-items:flex-end;justify-content:center;
  transform:scale(var(--ds,1));transform-origin:50% 100%;
  transition:transform .35s cubic-bezier(.2,.9,.25,1.1);}
.figure-box svg{width:116%;height:auto;overflow:visible;display:block;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.55))}
.shadow{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:146px;height:28px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.62), transparent 72%);
}

/* 선택 연출 */
.rune{
  position:absolute;bottom:-16px;left:50%;transform:translateX(-50%) rotateX(72deg);
  width:200px;height:200px;border-radius:50%;opacity:0;pointer-events:none;
  border:2px dashed rgba(240,220,170,.75);
  box-shadow:0 0 32px rgba(230,190,110,.55), inset 0 0 30px rgba(230,190,110,.30);
  transition:opacity .35s ease;
}
.rune::after{
  content:'';position:absolute;inset:26px;border-radius:50%;
  border:1px solid rgba(240,220,170,.45);
}
.hero.is-selected .rune{opacity:1;animation:spin 9s linear infinite}
@keyframes spin{to{transform:translateX(-50%) rotateX(72deg) rotate(360deg)}}

.beam{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:252px;height:520px;opacity:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(240,220,170,.00) 0%, rgba(240,220,170,.10) 55%, rgba(240,220,170,.22) 100%);
  clip-path:polygon(28% 0,72% 0,100% 100%,0 100%);
  transition:opacity .4s ease;filter:blur(6px);
}
.hero.is-selected .beam{opacity:1}

.fx{position:absolute;inset:-60px -40px 0;pointer-events:none;overflow:visible}
.pt{position:absolute;bottom:40px;opacity:0}
.pt.d{width:10px;height:10px;transform:rotate(45deg);background:linear-gradient(135deg,#fff6dd,#e2b85f);box-shadow:0 0 10px rgba(240,205,130,.9)}
.pt.o{width:6px;height:6px;border-radius:50%;background:#fff3d2;box-shadow:0 0 12px rgba(255,225,160,.95)}
.pt.s{width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,#fff8e6,rgba(226,184,95,0));box-shadow:0 0 8px rgba(240,205,130,.8)}
@keyframes rise{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  12%{opacity:1}
  70%{opacity:.9}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(var(--tsc))}
}
/* 상시 은은한 정령 입자 (스크린샷용) */
.mote{
  position:absolute;bottom:60px;width:5px;height:5px;border-radius:50%;
  background:#ffeec2;box-shadow:0 0 10px rgba(255,220,150,.9);opacity:0;
}
.hero.is-selected .mote{animation:float 3.6s ease-in-out infinite}
@keyframes float{
  0%{opacity:0;transform:translateY(0) scale(.6)}
  20%{opacity:.95}
  100%{opacity:0;transform:translateY(-230px) scale(.3)}
}
.burst{
  position:absolute;bottom:20px;left:50%;width:200px;height:200px;margin-left:-100px;
  border-radius:50%;border:2px solid rgba(255,235,190,.9);opacity:0;pointer-events:none;
}
@keyframes ring{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(1.7)}}

/* 이름표 */
.plate{
  position:relative;margin-top:16px;width:172px;padding:9px 8px 10px;
  text-align:center;
  background:linear-gradient(180deg,rgba(24,41,63,.95),rgba(10,19,31,.95));
  border:1px solid var(--gold-dim);border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .3s ease, border-color .3s ease, background .3s ease;
}
.hero.is-selected .plate{
  transform:scale(1.06);
  border-color:rgba(240,215,160,.85);
  background:linear-gradient(180deg,rgba(58,45,28,.96),rgba(28,22,14,.96));
  box-shadow:0 0 22px rgba(217,185,110,.45), inset 0 1px 0 rgba(255,255,255,.10);
}
.plate .cls{font-size:23px;font-weight:700;color:var(--cream);letter-spacing:1px;white-space:nowrap}
.hero.is-selected .plate .cls{color:#ffe9b8}
.plate .role{margin-top:3px;font-size:16px;color:var(--text-dim);letter-spacing:1px}

.check{
  position:absolute;top:-20px;left:-20px;width:42px;height:42px;border-radius:50%;
  background:linear-gradient(180deg,#e8613f,#b8362a);
  border:2px solid #ffd9a0;display:none;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.55);
}
.hero.is-selected .check{display:flex}

/* Coming Soon */
.soon-tag{
  position:absolute;top:150px;left:50%;transform:translateX(-50%) rotate(-7deg);
  padding:7px 16px;border-radius:6px;
  background:linear-gradient(180deg,rgba(38,54,76,.96),rgba(18,30,46,.96));
  border:1px solid rgba(160,185,215,.45);
  font-size:19px;font-weight:800;letter-spacing:3px;color:#b7c8dd;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  box-shadow:0 4px 12px rgba(0,0,0,.55);white-space:nowrap;
}
.lock{
  position:absolute;top:232px;left:50%;transform:translateX(-50%);
  width:56px;height:56px;border-radius:50%;
  background:rgba(10,18,30,.85);border:1px solid rgba(160,185,215,.35);
  display:flex;align-items:center;justify-content:center;
}
.hero.locked .plate .cls{color:#8ea0b8}
.shake{animation:sh .4s ease}
@keyframes sh{0%,100%{transform:translateY(var(--dy)) translateX(0)}
  20%{transform:translateY(var(--dy)) translateX(-10px)}
  50%{transform:translateY(var(--dy)) translateX(9px)}
  80%{transform:translateY(var(--dy)) translateX(-5px)}}

/* ---------- 공용 패널 ---------- */
.panel{
  position:relative;
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
  border:1px solid var(--gold-dim);border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
}
.panel .corner{position:absolute;width:16px;height:16px;border:1px solid rgba(217,185,110,.55)}
.panel .c1{top:8px;left:8px;border-right:0;border-bottom:0}
.panel .c2{top:8px;right:8px;border-left:0;border-bottom:0}
.panel .c3{bottom:8px;left:8px;border-right:0;border-top:0}
.panel .c4{bottom:8px;right:8px;border-left:0;border-top:0}
.panel-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px}
.panel-head .ln{width:56px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.panel-head .ln.r{background:linear-gradient(270deg,transparent,var(--gold-dim))}
.panel-head h3{font-size:27px;font-weight:700;color:var(--gold-lt);letter-spacing:3px}

/* ---------- 정보 패널 ---------- */
.content{position:relative;z-index:6;padding:0 40px}
.info{padding:26px 30px 24px;min-height:340px}
.info-top{display:flex;align-items:flex-start;gap:20px}
.info-name{font-size:40px;font-weight:800;color:#ffe9b8;letter-spacing:2px;
  text-shadow:0 0 16px rgba(217,185,110,.30)}
.tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{padding:5px 14px;border-radius:20px;font-size:18px;letter-spacing:1px;
  background:rgba(87,200,232,.10);border:1px solid rgba(87,200,232,.35);color:#9fdcf0}
.tag.g{background:rgba(217,185,110,.10);border-color:rgba(217,185,110,.38);color:#e6cd93}
.diff{margin-left:auto;text-align:right;flex-shrink:0}
.diff .lb{font-size:17px;color:var(--text-dim);letter-spacing:2px}
.diff .stars{margin-top:6px;font-size:24px;color:var(--gold);letter-spacing:4px}
.diff .stars i{color:#334458;font-style:normal}
.lore{margin-top:16px;font-size:21px;line-height:1.55;color:#9fb0c4}
.lore b{color:var(--gold-lt);font-weight:600}

.stats{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 34px}
.stat{display:flex;align-items:center;gap:12px}
.stat .k{width:76px;font-size:20px;color:#a9b8ca;letter-spacing:1px;flex-shrink:0}
.stat .bar{flex:1;height:12px;border-radius:6px;background:rgba(6,12,20,.85);
  border:1px solid rgba(217,185,110,.20);overflow:hidden;position:relative}
.stat .fill{height:100%;border-radius:5px;
  background:linear-gradient(90deg,#8a6a2e,#e6c273 60%,#ffeab8);
  box-shadow:0 0 10px rgba(230,194,115,.45);transition:width .45s ease}
.stat.cy .fill{background:linear-gradient(90deg,#1f6a86,#57c8e8 60%,#a9e9fb);
  box-shadow:0 0 10px rgba(87,200,232,.45)}
.stat .v{width:52px;text-align:right;font-size:19px;color:var(--cream);flex-shrink:0}

.skills{margin-top:20px;display:flex;align-items:center;gap:14px}
.skill{position:relative;width:74px;height:74px;border-radius:12px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(180deg,rgba(30,48,70,.9),rgba(12,22,36,.9));
  border:1px solid rgba(217,185,110,.30);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.skill.hi{border-color:rgba(240,215,160,.85);box-shadow:0 0 16px rgba(217,185,110,.35)}
.skill .art{position:absolute;inset:0}
.skill .glyph{position:relative;z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.skill.lk{background:linear-gradient(180deg,rgba(18,30,46,.95),rgba(9,16,26,.95));border-color:rgba(217,185,110,.16)}
.skill.lk .lv{font-size:19px;color:#6f8098;letter-spacing:.5px}
.skill-note{font-size:19px;color:var(--text-dim);line-height:1.45}
.skill-note b{color:#c9b98a}

/* ---------- 이름 입력 ---------- */
.namebox{margin-top:20px;padding:24px 30px 26px}
.name-row{display:flex;align-items:center;gap:14px}
.field{
  position:relative;flex:1;height:86px;border-radius:12px;
  background:linear-gradient(180deg,rgba(6,12,20,.95),rgba(10,18,30,.95));
  border:1px solid rgba(217,185,110,.38);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.6);
  display:flex;align-items:center;padding:0 20px;
}
.field.focus{border-color:rgba(240,215,160,.9);box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 0 18px rgba(217,185,110,.30)}
.field input{
  flex:1;background:transparent;border:0;outline:none;
  font-family:inherit;font-size:32px;color:#ffeec2;letter-spacing:2px;
}
.field input::placeholder{color:#5c6b7e;letter-spacing:1px}
.counter{font-size:20px;color:var(--text-dim);margin-left:12px;flex-shrink:0}
.counter b{color:var(--gold)}
.sq-btn{
  width:86px;height:86px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(32,52,76,.95),rgba(14,26,42,.95));
  border:1px solid rgba(217,185,110,.38);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
}
.sq-btn:active{transform:translateY(2px)}
.hint{margin-top:14px;font-size:19px;color:var(--text-dim);display:flex;align-items:center;gap:8px}
.hint.ok{color:#7fd6a2}
.hint.no{color:#e08a7a}

/* ---------- 하단 CTA ---------- */
.bottom{position:relative;z-index:6;padding:22px 40px 34px}
.cta{
  width:100%;height:112px;border-radius:14px;cursor:pointer;border:2px solid #f0c98a;
  background:linear-gradient(180deg,#ef7250 0%,#d9492f 48%,#a92c22 100%);
  box-shadow:0 8px 22px rgba(180,60,40,.40), inset 0 2px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.30);
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:38px;font-weight:800;color:#fff4e2;letter-spacing:8px;
  text-shadow:0 2px 4px rgba(0,0,0,.55);
  transition:filter .2s ease, transform .1s ease;
}
.cta:active{transform:translateY(3px)}
.cta.off{filter:saturate(.35) brightness(.48);cursor:not-allowed;border-color:rgba(240,201,138,.30);box-shadow:none}
.foot{margin-top:14px;text-align:center;font-size:18px;color:#61708a;letter-spacing:1px}

/* 토스트 */
.toast{
  position:absolute;left:50%;bottom:270px;transform:translateX(-50%) translateY(14px);
  padding:16px 34px;border-radius:10px;z-index:20;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(26,42,62,.97),rgba(12,22,36,.97));
  border:1px solid rgba(217,185,110,.45);
  font-size:23px;color:var(--cream);letter-spacing:1px;
  box-shadow:0 8px 24px rgba(0,0,0,.6);
  transition:opacity .25s ease, transform .25s ease;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="viewport">
<div class="phone">
  <div class="bg-rays"></div>
  <div class="bg-glow"></div>
  <div class="bg-vignette"></div>

  <!-- ================= 상단 바 ================= -->
  <div class="topbar">
    <div class="icon-btn left">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e8dcc0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 L8 12 L15 19"/>
      </svg>
    </div>
    <div class="title-wrap">
      <div class="line"></div><div class="dia"></div>
      <div class="screen-title">영웅 선택</div>
      <div class="dia"></div><div class="line r"></div>
    </div>
    <div class="icon-btn right">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e8dcc0" stroke-width="2">
        <circle cx="12" cy="12" r="9"/><path d="M9.4 9.2a2.7 2.7 0 1 1 3.4 3.2c-.6.2-.9.7-.9 1.3v.4" stroke-linecap="round"/>
        <circle cx="12" cy="17.4" r="1.1" fill="#e8dcc0" stroke="none"/>
      </svg>
    </div>
    <div class="sub-title">함께 모험을 시작할 영웅을 선택하세요</div>
  </div>

  <!-- ================= 스테이지 ================= -->
  <div class="stage">
    <div class="skyfield">
      <span style="left:12%;top:64px;--d:0s"></span><span style="left:23%;top:150px;--d:1.2s"></span>
      <span style="left:38%;top:92px;--d:2.1s"></span><span style="left:52%;top:38px;--d:.6s"></span>
      <span style="left:66%;top:132px;--d:1.7s"></span><span style="left:79%;top:74px;--d:2.6s"></span>
      <span style="left:88%;top:168px;--d:.9s"></span><span style="left:30%;top:214px;--d:3.1s"></span>
      <span style="left:71%;top:222px;--d:2.3s"></span>
    </div>
    <div class="floor">
      <div class="disc"></div>
      <div class="rim"></div>
      <div class="rim inner"></div>
    </div>
    <div class="floor-line"></div>
    <div class="lineup" id="lineup"></div>
  </div>

  <!-- ================= 정보 / 이름 ================= -->
  <div class="content">

  if (h.locked){
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    showToast(`${h.cls} · 준비 중인 영웅입니다`);
    return;
  }
  current = id;
  lineup.querySelectorAll('.hero').forEach(n => {
    const on = n.dataset.id === id;
    n.classList.toggle('is-selected', on);
    n.classList.toggle('dimmed', !on);      // ← 선택되지 않은 캐릭터 어둡게
  });
  if (burst) spawnParticles(el);
  renderInfo(h);
  validate();
}

/* 파티클 분출 */
function spawnParticles(el){
  const fx = el.querySelector('.fx');
  const ring = document.createElement('div');
  ring.className = 'burst';
  ring.style.animation = 'ring .75s ease-out forwards';
  fx.appendChild(ring);
  setTimeout(() => ring.remove(), 800);

  for (let i = 0; i < 40; i++){
    const p = document.createElement('div');
    const kind = i % 5 === 0 ? 'd' : (i % 3 === 0 ? 's' : 'o');
    p.className = 'pt ' + kind;
    const sc = .5 + Math.random() * 1.2;
    p.style.left = (12 + Math.random() * 76) + '%';
    p.style.bottom = (10 + Math.random() * 120) + 'px';
    p.style.setProperty('--tx', (Math.random() * 150 - 75) + 'px');
    p.style.setProperty('--ty', (-160 - Math.random() * 230) + 'px');
    p.style.setProperty('--tsc', sc.toFixed(2));
    p.style.animation = `rise ${(1 + Math.random() * .9).toFixed(2)}s cubic-bezier(.2,.7,.4,1) ${(Math.random()*.28).toFixed(2)}s forwards`;
    fx.appendChild(p);
    setTimeout(() => p.remove(), 2400);
  }
}

/* 정보 패널 */
function renderInfo(h){
  document.getElementById('iName').textContent = h.cls;
  document.getElementById('iTags').innerHTML =
    h.tags.map((t, i) => `<span class="tag${i === 0 ? ' g' : ''}">${t}</span>`).join('');
  document.getElementById('iStars').innerHTML =
    [1,2,3,4,5].map(n => n <= h.stars ? '★' : '<i>★</i>').join('');
  document.getElementById('iLore').innerHTML = h.lore;
  document.getElementById('iStats').innerHTML = h.stats.map(([k, v], i) => `
    <div class="stat${i % 2 ? ' cy' : ''}">
      <div class="k">${k}</div>
      <div class="bar"><div class="fill" style="width:${v}%"></div></div>
      <div class="v">${v}</div>
    </div>`).join('');
  const arr = SKILL_ART[h.id];
  document.getElementById('iSkills').innerHTML =
    arr.map(sk => sk.lv
      ? `<div class="skill lk"><span class="lv">${sk.lv}</span></div>`
      : `<div class="skill hi"><span class="art" style="background:${sk.bg}"></span><span class="glyph">${sk.g}</span></div>`
    ).join('') +
    `<div class="skill-note">시작 스킬 <b>${arr[0].n}</b><br>나머지 스킬은 <b>Lv.5</b>부터 순차 해금됩니다</div>`;
}

/* ==========================================================
   4) 이름 입력
   ========================================================== */
const input = document.getElementById('nameInput');
const field = document.getElementById('field');
const hint  = document.getElementById('hint');
const cta   = document.getElementById('cta');

input.addEventListener('focus', () => field.classList.add('focus'));
input.addEventListener('blur',  () => field.classList.remove('focus'));
input.addEventListener('input', validate);
document.getElementById('diceBtn').addEventListener('click', () => {
  input.value = RANDOM_NAMES[Math.floor(Math.random() * RANDOM_NAMES.length)];
  validate();
});

function validate(){
  const v = input.value.trim();
  document.getElementById('cnt').textContent = v.length;
  let ok = false, msg = '2~12자의 한글 · 영문 · 숫자를 사용할 수 있습니다', cn = '';
  if (v.length === 0){ /* 기본 안내 */ }
  else if (v.length < 2){ msg = '이름은 2자 이상이어야 합니다'; cn = 'no'; }
  else if (!/^[가-힣a-zA-Z0-9]+$/.test(v)){ msg = '특수문자와 공백은 사용할 수 없습니다'; cn = 'no'; }
  else { msg = `‘${v}’ · 사용 가능한 이름입니다`; cn = 'ok'; ok = true; }
  hint.textContent = msg;
  hint.className = 'hint ' + cn;
  cta.classList.toggle('off', !(ok && current));
}

cta.addEventListener('click', () => {
  if (cta.classList.contains('off')){
    showToast(current ? '캐릭터 이름을 입력해 주세요' : '영웅을 선택해 주세요');
    return;
  }
  const h = HEROES.find(x => x.id === current);
  showToast(`${h.cls} ‘${input.value.trim()}’ · 모험을 시작합니다`);
});

/* 토스트 */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ==========================================================
   5) 초기 상태 & 뷰포트 스케일
   ========================================================== */
select('hunt', false);
setTimeout(() => spawnParticles(lineup.querySelector('.hero[data-id="hunt"]')), 400);

function fit(){
  const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  document.getElementById('viewport').style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit); fit();
</script>
